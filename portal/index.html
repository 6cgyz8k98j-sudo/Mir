<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Портал абонента</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css" />
  <style>
    :root {
      --primary: #1F4E79;
      --accent:  #2E75B6;
      --bg:      #F4F7FB;
      --card-bg: #FFFFFF;
      --text:    #1a1a2e;
      --muted:   #6b7280;
      --border:  #d1d5db;
      --green:   #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #0f172a;
        --card-bg: #1e293b;
        --text:    #f1f5f9;
        --muted:   #94a3b8;
        --border:  #334155;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Header */
    header { background: var(--primary); color: #fff; padding: 18px 24px; display: flex; align-items: center; gap: 14px; }
    header .logo { width: 40px; height: 40px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    header .logo span { color: var(--primary); font-weight: 900; font-size: 18px; }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header p  { font-size: 0.78rem; opacity: .75; }

    main { max-width: 900px; margin: 0 auto; padding: 32px 16px; }

    /* Hero */
    .hero { text-align: center; margin-bottom: 32px; }
    .hero h2 { font-size: 1.6rem; color: var(--primary); font-weight: 700; margin-bottom: 8px; }
    .hero p  { color: var(--muted); font-size: .95rem; }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }

    /* Card */
    .card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 14px; padding: 24px 18px; text-align: center; cursor: pointer; position: relative; }
    .card:hover { border-color: var(--accent); }
    .card.selected { border-color: var(--accent); outline: 2px solid var(--accent); }
    .card.disabled { opacity: .45; pointer-events: none; }
    .badge-top { position: absolute; top: 10px; right: 10px; background: #f59e0b; color: #fff; font-size: .65rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
    .badge-role { display: inline-block; background: #dbeafe; color: var(--accent); font-size: .7rem; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-bottom: 10px; }
    .avatar { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; margin: 0 auto 12px; border: 3px solid var(--border); }
    .card h3 { font-size: .95rem; font-weight: 700; margin-bottom: 4px; }
    .stars { color: #f59e0b; font-size: 1rem; margin-bottom: 10px; }
    .card-phone { font-size: .8rem; color: var(--muted); margin-bottom: 12px; }
    .btn-wa { display: inline-flex; align-items: center; gap: 6px; background: #25d366; color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: .82rem; font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn-wa:hover { background: #1db954; }

    /* Confirm form */
    .confirm-box { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 28px; margin-bottom: 24px; display: none; }
    .confirm-box.show { display: block; }
    .confirm-box h3 { color: var(--primary); font-size: 1.1rem; margin-bottom: 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 4px; }
    .field input { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: .9rem; background: var(--bg); color: var(--text); }
    .field input:focus { outline: none; border-color: var(--accent); }
    .btn-submit { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 11px; font-size: .95rem; font-weight: 600; cursor: pointer; }
    .btn-submit:hover { background: var(--accent); }
    .error-msg { color: #dc2626; font-size: .8rem; margin-top: 4px; display: none; }

    /* Success */
    .success { text-align: center; padding: 48px 24px; display: none; }
    .success.show { display: block; }
    .success .icon { font-size: 3.5rem; color: var(--green); margin-bottom: 16px; }
    .success h2 { color: var(--primary); margin-bottom: 8px; }
    .success p { color: var(--muted); }
  </style>
</head>
<body>

<header>
  <div class="logo"><span>П</span></div>
  <div>
    <h1>Портал абонента</h1>
    <p>Выберите персонального менеджера</p>
  </div>
</header>

<main>
  <div class="hero">
    <h2>Подберём тариф именно для вас</h2>
    <p>Наши менеджеры помогут подобрать подходящий тарифный план<br>для услуг ШПД, TV и FMS</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="confirm-box" id="confirmBox">
    <h3 id="confirmTitle">Вы выбрали менеджера</h3>
    <div class="field">
      <label>ФИО абонента <span style="color:#dc2626">*</span></label>
      <input type="text" id="fio" placeholder="Иванов Иван Иванович" />
      <div class="error-msg" id="fioErr">Обязательное поле</div>
    </div>
    <div class="field">
      <label>Номер телефона <span style="color:#dc2626">*</span></label>
      <input type="tel" id="phone" placeholder="+7 (___) ___-__-__" />
      <div class="error-msg" id="phoneErr">Обязательное поле</div>
    </div>
    <div class="field">
      <label>Номер договора / лицевой счёт</label>
      <input type="text" id="contract" placeholder="Необязательно" />
    </div>
    <button class="btn-submit" onclick="submitForm()">Подтвердить выбор менеджера</button>
  </div>

  <div class="success" id="success">
    <div class="icon"><i class="ti ti-circle-check"></i></div>
    <h2>Заявка отправлена!</h2>
    <p id="successText">Ваш менеджер свяжется с вами в ближайшее время.</p>
  </div>
</main>

<script>
const managers = [
  { id: 1, name: "Калибеков Ерасыл",  pos: "Хантер", phone: "8 (777) 777-77-77", wa: "77777777777", rating: 5, top: true,  avatar: "https://ui-avatars.com/api/?name=КЕ&background=1F4E79&color=fff&size=150" },
  { id: 2, name: "Нурсултанов Абзал", pos: "Хантер", phone: "8 (777) 777-77-77", wa: "77777777777", rating: 4, top: false, avatar: "https://ui-avatars.com/api/?name=НА&background=2E75B6&color=fff&size=150" },
  { id: 3, name: "Байораз Нурлан",    pos: "Хантер", phone: "8 (777) 777-77-77", wa: "77777777777", rating: 4, top: false, avatar: "https://ui-avatars.com/api/?name=БН&background=1e6091&color=fff&size=150" },
];

let selectedManager = null;

function stars(n) {
  return "★".repeat(n) + "☆".repeat(5 - n);
}

function renderCards() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  managers.forEach(m => {
    const waMsg = encodeURIComponent(`Здравствуйте! Хочу записаться на консультацию по тарифному плану.`);
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = m.id;
    card.innerHTML = `
      ${m.top ? '<span class="badge-top">Топ менеджер</span>' : ""}
      <img class="avatar" src="${m.avatar}" alt="${m.name}" />
      <span class="badge-role">${m.pos}</span>
      <h3>${m.name}</h3>
      <div class="stars">${stars(m.rating)}</div>
      <div class="card-phone"><i class="ti ti-phone"></i> ${m.phone}</div>
      <a class="btn-wa" href="https://wa.me/${m.wa}?text=${waMsg}" target="_blank" onclick="event.stopPropagation()">
        <i class="ti ti-brand-whatsapp"></i> WhatsApp
      </a>
    `;
    card.addEventListener("click", () => selectManager(m, card));
    grid.appendChild(card);
  });
}

function selectManager(m, cardEl) {
  selectedManager = m;
  document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
  cardEl.classList.add("selected");
  const box = document.getElementById("confirmBox");
  document.getElementById("confirmTitle").textContent = `Выбран менеджер: ${m.name}`;
  box.classList.add("show");
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function submitForm() {
  const fio   = document.getElementById("fio").value.trim();
  const phone = document.getElementById("phone").value.trim();
  let ok = true;

  document.getElementById("fioErr").style.display   = fio   ? "none" : "block";
  document.getElementById("phoneErr").style.display = phone ? "none" : "block";
  if (!fio || !phone) return;

  document.getElementById("confirmBox").classList.remove("show");
  document.querySelectorAll(".card").forEach(c => c.classList.add("disabled"));

  document.getElementById("successText").textContent =
    `${fio}, менеджер ${selectedManager.name} свяжется с вами по номеру ${phone}.`;
  document.getElementById("success").classList.add("show");
}

renderCards();
</script>
</body>
</html>
